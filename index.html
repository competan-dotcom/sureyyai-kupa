<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Süreyyai Dünya Kupasında</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header / Top Bar -->
    <header class="app-header">
        <div class="header-content">
            <div class="header-logo-container">
                <img src="logo.png" alt="Süreyyai" class="header-logo">
                <div class="header-text-container">
                    <h1 class="header-brand">SÜREYYAİ</h1>
                    <span class="header-sub">DÜNYA KUPASI</span>
                </div>
            </div>
            <div class="date-container">
                <div id="current-date">--</div>
                <div id="current-time">--</div>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="app-main">
        <!-- Fixtures Tab (Default) -->
        <section id="tab-home" class="tab-content active">
            <!-- JS will inject all 104 matches grouped by date here -->
            <div id="all-fixtures" class="matches-container"></div>
        </section>

        <!-- Standings Tab -->
        <section id="tab-standings" class="tab-content">
            <h2 class="section-title">A Grubu</h2>
            <table class="mockup-table">
                <thead>
                    <tr>
                        <th>Takım</th>
                        <th>O</th>
                        <th>G</th>
                        <th>B</th>
                        <th>M</th>
                        <th>P</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td class="team-cell"><span class="flag">🇲🇽</span> Meksika</td>
                        <td>2</td><td>2</td><td>0</td><td>0</td><td>6</td>
                    </tr>
                    <tr>
                        <td class="team-cell"><span class="flag">🇿🇦</span> G. Afrika</td>
                        <td>2</td><td>1</td><td>0</td><td>1</td><td>3</td>
                    </tr>
                    <tr>
                        <td class="team-cell"><span class="flag">🇰🇷</span> G. Kore</td>
                        <td>2</td><td>1</td><td>0</td><td>1</td><td>3</td>
                    </tr>
                    <tr>
                        <td class="team-cell"><span class="flag">🇨🇿</span> Çek Cum.</td>
                        <td>2</td><td>0</td><td>0</td><td>2</td><td>0</td>
                    </tr>
                </tbody>
            </table>
        </section>

        <!-- Statistics Tab -->
        <section id="tab-stats" class="tab-content">
            <h2 class="section-title">Gol Krallığı</h2>
            
            <div class="mockup-stat-card">
                <div class="mockup-stat-left">
                    <span class="mockup-stat-rank">1</span>
                    <span class="flag">🇫🇷</span>
                    <div class="mockup-stat-info">
                        <h4>Kylian Mbappé</h4>
                        <p>Fransa</p>
                    </div>
                </div>
                <div class="mockup-stat-value">4</div>
            </div>

            <div class="mockup-stat-card">
                <div class="mockup-stat-left">
                    <span class="mockup-stat-rank">2</span>
                    <span class="flag">🏴󠁧󠁢󠁥󠁮󠁧󠁿</span>
                    <div class="mockup-stat-info">
                        <h4>Harry Kane</h4>
                        <p>İngiltere</p>
                    </div>
                </div>
                <div class="mockup-stat-value">3</div>
            </div>
            
        </section>
    </main>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <button class="nav-item active" data-target="tab-home">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
            <span>Fikstür</span>
        </button>
        <button class="nav-item" data-target="tab-standings">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20v-8M6 20V4M18 20v-4"></path></svg>
            <span>Puan Durumu</span>
        </button>
        <button class="nav-item" data-target="tab-stats">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg>
            <span>İstatistik</span>
        </button>
    </nav>

    <script src="app.js"></script>
</body>
</html>
