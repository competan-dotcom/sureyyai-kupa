<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Süreyyai Dünya Kupasında</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header / Top Bar -->
    <header class="app-header">
        <div class="header-content">
            <div class="header-logo-container">
                <img src="logo.png" alt="Süreyyai" class="header-logo">
                <div class="header-text-container">
                    <h1 class="header-brand">SÜREYYAİ</h1>
                    <span class="header-sub">DÜNYA KUPASI</span>
                </div>
            </div>
            <div class="date-container">
                <div id="current-date">--</div>
                <div id="current-time">--</div>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="app-main">
        <!-- Fixtures Tab (Default) -->
        <section id="tab-home" class="tab-content active">
            <!-- JS will inject all 104 matches grouped by date here -->
            <div id="all-fixtures" class="matches-container"></div>
        </section>

        <!-- Standings Tab -->
        <section id="tab-standings" class="tab-content">
            <div class="placeholder-text">
                <h3>🏆 Puan Durumu</h3>
                <p>Turnuva başladığında grupların canlı puan durumları burada listelenecektir.</p>
            </div>
        </section>

        <!-- Statistics Tab -->
        <section id="tab-stats" class="tab-content">
            <div class="placeholder-text">
                <h3>📊 Turnuva İstatistikleri</h3>
                <p>Gol krallığı, asist liderleri ve takım istatistikleri turnuva ile birlikte güncellenecektir.</p>
            </div>
        </section>
    </main>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <button class="nav-item active" data-target="tab-home">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
            <span>Fikstür</span>
        </button>
        <button class="nav-item" data-target="tab-standings">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20v-8M6 20V4M18 20v-4"></path></svg>
            <span>Puan Durumu</span>
        </button>
        <button class="nav-item" data-target="tab-stats">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg>
            <span>İstatistik</span>
        </button>
    </nav>

    <script src="app.js"></script>
</body>
</html>
