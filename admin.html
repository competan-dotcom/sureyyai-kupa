<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Süreyya AI - Admin Paneli</title>
    <style>
        body { font-family: 'Inter', sans-serif; background: #0f172a; color: white; margin: 0; padding: 20px; }
        .match { background: #1e293b; padding: 15px; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        input { width: 50px; text-align: center; padding: 5px; font-weight: bold; border-radius: 4px; border: none; }
        .scorer-input { width: 120px; text-align: left; }
        button { background: #3b82f6; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background: #2563eb; }
        .header { margin-bottom: 20px; border-bottom: 1px solid #334155; padding-bottom: 10px; }
        .status { color: #10b981; font-size: 14px; margin-top: 10px; }
        .section-title { margin-top: 30px; margin-bottom: 15px; font-size: 1.2rem; color: #e2e8f0; }
    </style>
</head>
<body>
    <div class="header">
        <h2>🏆 Süreyya AI - Skor Güncelleme Paneli</h2>
        <p>Maç skorlarını ve gol krallığını buradan güncelleyebilirsin!</p>
        <button id="saveAll" style="background:#10b981; width: 100%; padding: 12px; margin-top: 10px;">TÜM DEĞİŞİKLİKLERİ YAYINLA (GİTHUB'A PUSHLA)</button>
        <div id="statusMsg" class="status"></div>
    </div>
    
    <h3 class="section-title">⚽ Gol Krallığı (İlk 3)</h3>
    <div id="scorersContainer" style="background: #1e293b; padding: 15px; border-radius: 8px; margin-bottom: 30px;">
        Yükleniyor...
    </div>

    <h3 class="section-title">📅 Tüm Fikstür (104 Maç)</h3>
    <div id="matchesContainer">Yükleniyor...</div>

    <script>
        let currentData = null;

        async function loadMatches() {
            try {
                const res = await fetch('data.json?t=' + Date.now());
                currentData = await res.json();
                renderScorers();
                renderMatches();
            } catch(e) {
                document.getElementById('matchesContainer').innerHTML = "Veri yüklenemedi!";
            }
        }

        function renderScorers() {
            const container = document.getElementById('scorersContainer');
            container.innerHTML = '';
            
            if (!currentData.topScorers) currentData.topScorers = [{}, {}, {}];
            
            for(let i=0; i<3; i++) {
                const ts = currentData.topScorers[i] || { name: '', team: '', flag: '', goals: 0 };
                const div = document.createElement('div');
                div.style.marginBottom = "10px";
                div.style.display = "flex";
                div.style.gap = "10px";
                
                div.innerHTML = `
                    <div style="width: 20px;">${i+1}.</div>
                    <input type="text" class="scorer-input" id="ts_name_${i}" value="${ts.name}" placeholder="Oyuncu Adı">
                    <input type="text" class="scorer-input" id="ts_team_${i}" value="${ts.team}" placeholder="Ülkesi">
                    <input type="text" id="ts_flag_${i}" value="${ts.flag}" placeholder="Bayrak" style="width: 30px;">
                    <input type="number" id="ts_goals_${i}" value="${ts.goals}" placeholder="Gol" style="width: 40px;">
                `;
                container.appendChild(div);
            }
        }

        function renderMatches() {
            const container = document.getElementById('matchesContainer');
            container.innerHTML = '';
            
            // Tüm maçları göster
            currentData.matches.forEach((m, index) => {
                const div = document.createElement('div');
                div.className = 'match';
                
                let s1 = '', s2 = '';
                if(m.score) {
                    const parts = m.score.split('-');
                    s1 = parts[0]; s2 = parts[1];
                }

                div.innerHTML = `
                    <div style="flex:1;">
                        <div style="font-size: 12px; color: #94a3b8;">${new Date(m.date_utc).toLocaleDateString('tr-TR')} - ${m.group}</div>
                        <div><b>${m.team1.name}</b> vs <b>${m.team2.name}</b></div>
                    </div>
                    <div style="display:flex; gap: 8px; align-items:center;">
                        <input type="number" id="s1_${index}" value="${s1}" placeholder="-">
                        <span>-</span>
                        <input type="number" id="s2_${index}" value="${s2}" placeholder="-">
                    </div>
                `;
                container.appendChild(div);
            });
        }

        document.getElementById('saveAll').addEventListener('click', async () => {
            const btn = document.getElementById('saveAll');
            const status = document.getElementById('statusMsg');
            btn.disabled = true;
            btn.textContent = "Kaydediliyor...";
            
            // Skorları güncelle
            currentData.matches.forEach((m, index) => {
                const s1 = document.getElementById('s1_'+index).value;
                const s2 = document.getElementById('s2_'+index).value;
                
                if (s1 !== '' && s2 !== '') {
                    m.score = `${s1}-${s2}`;
                    m.status = 'finished';
                } else {
                    m.score = null;
                    m.status = null;
                }
            });

            // Krallığı güncelle
            currentData.topScorers = [];
            for(let i=0; i<3; i++) {
                currentData.topScorers.push({
                    name: document.getElementById('ts_name_'+i).value || '-',
                    team: document.getElementById('ts_team_'+i).value || '-',
                    flag: document.getElementById('ts_flag_'+i).value || '🏳',
                    goals: parseInt(document.getElementById('ts_goals_'+i).value || '0')
                });
            }

            // Node.js sunucusuna POST atıyoruz
            try {
                const response = await fetch('/save', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(currentData)
                });
                
                const result = await response.json();
                if (result.success) {
                    status.textContent = "✅ Değişiklikler başarıyla GitHub'a pushlandı! Netlify 10 sn içinde güncelleyecek.";
                } else {
                    status.textContent = "❌ Hata: " + result.error;
                    status.style.color = "#ef4444";
                }
            } catch (err) {
                status.textContent = "❌ Sunucu bağlantı hatası! admin-server.js'nin çalıştığından emin ol.";
                status.style.color = "#ef4444";
            } finally {
                btn.textContent = "TÜM DEĞİŞİKLİKLERİ YAYINLA";
                btn.disabled = false;
            }
        });

        loadMatches();
    </script>
</body>
</html>
